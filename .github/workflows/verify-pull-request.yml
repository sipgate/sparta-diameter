name: Verify Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-pr:
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: ${{ matrix.java }}
          cache: maven
          server-id: central
      - name: Build and Test
        run: mvn -B clean verify

  check-sonar:
    # check repository name so this does not run on forks,
    # because the SONAR_TOKEN isn't known to forks anyway
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs the full history for SCM blame and new-code detection.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"
          cache: maven
          server-id: central
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No coverage report, so skipping tests loses no Sonar input.
        run: |
          mvn -B clean verify -DskipTests \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.organization=sipgate \
            -Dsonar.projectKey=sipgate_${{ github.event.repository.name }}

  check-publishable:
    # Exercise the deploy profile so javadoc and sources breakage surfaces here,
    # not when a release tag is pushed. Tests already ran in the check-pr matrix,
    # and signing needs a key, so both stay off (gpg binds to verify, which
    # package never reaches).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"
          cache: maven
          server-id: central
      - name: Build sources and javadoc jars
        run: mvn -B -P deploy clean package -DskipTests
