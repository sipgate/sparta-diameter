name: Verify Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  check-pr:
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "24", "25"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: ${{ matrix.java }}
          cache: maven
          server-id: central
      - name: Build and Test
        run: mvn -B clean verify

  check-publishable:
    # Exercise the deploy profile so javadoc and sources breakage surfaces here,
    # not when a release tag is pushed. Tests already ran in the check-pr matrix,
    # and signing needs a key, so both stay off (gpg binds to verify, which
    # package never reaches).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: maven
          server-id: central
      - name: Build sources and javadoc jars
        run: mvn -B -P deploy clean package -DskipTests
