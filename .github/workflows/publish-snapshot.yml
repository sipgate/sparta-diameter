name: Build, test and publish snapshot

on:
  push:
    branches: ["main"]
    paths:
      - "**/pom.xml"
      - "**/src/**"
  workflow_dispatch:

concurrency:
  group: maven-central-publish-snapshot
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check for SNAPSHOT version
        id: version
        run: |
          version="$(mvn -q -N -B help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        if: endsWith(steps.version.outputs.version, '-SNAPSHOT')
        with:
          distribution: "zulu"
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Build, Test, Sign and Deploy Snapshot to Maven Central
        if: endsWith(steps.version.outputs.version, '-SNAPSHOT')
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: mvn -B -P deploy deploy
